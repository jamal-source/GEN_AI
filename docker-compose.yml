services:
  # ── MitraKu AI Web Platform (Node.js + Express) ─────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitraku_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - .:/app

  # ── PostgreSQL Database for MitraKu AI ─────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mitraku_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mitraku_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mitraku_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mitraku_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mitraku_admin} -d ${POSTGRES_DB:-mitraku_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langflow AI RAG Builder ─────────────────────────────────
  langflow:
    image: langflowai/langflow:latest
    container_name: mitraku_langflow
    restart: always
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - LANGFLOW_HOST=0.0.0.0
      - LANGFLOW_PORT=7860
      - LANGFLOW_NUM_WORKERS=1
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER_USERNAME=admin
      - LANGFLOW_SUPERUSER_PASSWORD=admin
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - langflow_data:/app/langflow

volumes:
  postgres_data:
  langflow_data:
