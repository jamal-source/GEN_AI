<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Service Toko — 24/7 AI</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="w-app" id="w-app">
    <header class="w-header">
      <div class="w-avatar" aria-hidden="true">CS</div>
      <div class="w-head-text">
        <h1 class="w-title" id="w-store-name">Customer Service Toko</h1>
        <p class="w-sub"><span class="w-dot" aria-hidden="true"></span> Online 24/7</p>
      </div>
      <button type="button" id="w-reset-btn" class="w-reset" title="Mulai ulang percakapan" aria-label="Mulai ulang percakapan">↺</button>
    </header>

    <div id="w-chat-box" class="w-chat-box" role="log" aria-live="polite" aria-relevant="additions" aria-label="Percakapan dengan Customer Service"></div>

    <div id="w-quick" class="w-quick" aria-label="Pertanyaan cepat"></div>

    <form id="w-form" class="w-composer" autocomplete="off">
      <textarea id="w-input" class="w-input" rows="1" placeholder="Tulis pertanyaan Anda..." aria-label="Tulis pertanyaan Anda"></textarea>
      <button type="submit" id="w-send-btn" class="w-send" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22 11 13 2 9z" />
        </svg>
      </button>
    </form>
  </div>

  <script src="widget.js"></script>
</body>
</html>
